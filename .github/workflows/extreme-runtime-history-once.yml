name: Extreme Runtime History Once

on:
  push:
    branches: [phase13]
    paths:
      - .github/workflows/extreme-runtime-history-once.yml

permissions:
  contents: write

jobs:
  patch-test-rebase-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase13.2
          fetch-depth: 0

      - name: Patch runtime history support
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Carry condition evidence through activation and runtime stream layers.
          p = Path('minmax/runtime_effect_activation.py')
          text = p.read_text()
          if 'from .character_build.effect_relationship import ConditionContext' not in text:
              text = text.replace(
                  'from .character_build.effect_instance import EffectVariant\n',
                  'from .character_build.effect_instance import EffectVariant\nfrom .character_build.effect_relationship import ConditionContext\n',
                  1,
              )
          text = text.replace(
              '    chance_roll: float | None = None,\n) -> RuntimeEffectActivationResult:',
              '    chance_roll: float | None = None,\n    condition_context: ConditionContext | None = None,\n) -> RuntimeEffectActivationResult:',
              1,
          )
          text = text.replace(
              '        chance_roll=chance_roll,\n    )\n',
              '        chance_roll=chance_roll,\n        condition_context=condition_context,\n    )\n',
              1,
          )
          p.write_text(text)

          p = Path('minmax/runtime_effect_runtime.py')
          text = p.read_text()
          if 'from .character_build.effect_relationship import ConditionContext' not in text:
              text = text.replace(
                  'from .character_build.effect_instance import EffectVariant\n',
                  'from .character_build.effect_instance import EffectVariant\nfrom .character_build.effect_relationship import ConditionContext\n',
                  1,
              )
          text = text.replace(
              '    chance_roll: float | None = None,\n) -> RuntimeEffectTransitionResult:',
              '    chance_roll: float | None = None,\n    condition_context: ConditionContext | None = None,\n) -> RuntimeEffectTransitionResult:',
              1,
          )
          text = text.replace(
              '        chance_roll=chance_roll,\n    )\n',
              '        chance_roll=chance_roll,\n        condition_context=condition_context,\n    )\n',
              1,
          )
          p.write_text(text)

          p = Path('minmax/runtime_effect_sequence.py')
          text = p.read_text()
          if 'from .character_build.effect_relationship import ConditionContext' not in text:
              text = text.replace(
                  'from .character_build.effect_instance import EffectVariant\n',
                  'from .character_build.effect_instance import EffectVariant\nfrom .character_build.effect_relationship import ConditionContext\n',
                  1,
              )
          text = text.replace(
              'class RuntimeEffectEventAttempt:\n    """One observed runtime event and its deterministic chance input, if any."""\n\n    event: RuntimeEvent\n    chance_roll: float | None = None\n',
              'class RuntimeEffectEventAttempt:\n    """One observed runtime event plus deterministic chance/condition evidence."""\n\n    event: RuntimeEvent\n    chance_roll: float | None = None\n    condition_context: ConditionContext | None = None\n',
              1,
          )
          text = text.replace(
              '            chance_roll=attempt.chance_roll,\n        )\n',
              '            chance_roll=attempt.chance_roll,\n            condition_context=attempt.condition_context,\n        )\n',
              1,
          )
          p.write_text(text)

          p = Path('minmax/runtime_effect_stream.py')
          text = p.read_text()
          text = text.replace(
              '            chance_roll=attempt.chance_roll,\n        )\n',
              '            chance_roll=attempt.chance_roll,\n            condition_context=attempt.condition_context,\n        )\n',
              1,
          )
          p.write_text(text)

          # Gear runtime: ordered history can establish the latest surviving window.
          p = Path('services/extreme_actual_heal_gear_runtime_buff_service.py')
          text = p.read_text()
          if 'RuntimeEffectEventAttempt' not in text:
              text = text.replace(
                  'from minmax.runtime_event import RuntimeEvent, runtime_event_matches_effect_variant\n',
                  'from minmax.runtime_event import RuntimeEvent, runtime_event_matches_effect_variant\nfrom minmax.runtime_effect_sequence import RuntimeEffectEventAttempt\nfrom minmax.runtime_effect_stream import process_effect_variant_runtime_stream\nfrom minmax.runtime_effect_window import partition_runtime_effect_windows\n',
                  1,
              )
          marker = '        return ExtremeActualHealGearRuntimeBuffResult(\n            active_buffs=tuple(dict.fromkeys(active)),\n            unresolved=tuple(dict.fromkeys(unresolved)),\n        )\n'
          method = '''\n\n    def resolve_history(\n        self,\n        build: PlayerBuild,\n        *,\n        active_bar: str,\n        attempts: tuple[RuntimeEffectEventAttempt, ...],\n        snapshot_time_seconds: float,\n    ) -> ExtremeActualHealGearRuntimeBuffResult:\n        snapshot = float(snapshot_time_seconds)\n        active: list[str] = []\n        unresolved: list[str] = []\n        counts = GearStatInputResolver.equipped_set_counts(build, active_bar=active_bar)\n        for set_name, piece_count in sorted(counts.items(), key=lambda item: item[0].casefold()):\n            gear_set = self.repository.get_set(set_name)\n            if gear_set is None:\n                continue\n            for effect in self.resolver.resolve(gear_set.id, int(piece_count)):\n                buff = self._named_buff(effect)\n                if buff is None:\n                    continue\n                if effect.target_type not in (SupportTargetType.SELF, SupportTargetType.SELF_OR_ALLY):\n                    continue\n                relevant = tuple(\n                    attempt for attempt in attempts\n                    if attempt.event.time_seconds <= snapshot\n                    and runtime_event_matches_effect_variant(attempt.event, effect)\n                )\n                if not relevant:\n                    continue\n                stream = process_effect_variant_runtime_stream(relevant, effect)\n                for step in stream.unresolved_steps:\n                    reasons = step.transition.unresolved or step.transition.activation.eligibility.reasons\n                    if reasons:\n                        unresolved.append(\n                            f"{set_name} {buff} runtime history unresolved: {', '.join(reasons)}"\n                        )\n                partition = partition_runtime_effect_windows(\n                    stream.final_state.windows, at_time_seconds=snapshot\n                )\n                if any(window.effect_name == effect.name for window in partition.active):\n                    active.append(buff)\n        return ExtremeActualHealGearRuntimeBuffResult(\n            active_buffs=tuple(dict.fromkeys(active)),\n            unresolved=tuple(dict.fromkeys(unresolved)),\n        )\n'''
          if 'def resolve_history(' not in text:
              text = text.replace(marker, marker + method, 1)
          p.write_text(text)

          # Skill runtime: history over currently slotted triggered buff effects.
          p = Path('services/extreme_actual_heal_skill_buff_candidate_service.py')
          text = p.read_text()
          if 'RuntimeEffectEventAttempt' not in text:
              text = text.replace(
                  'from minmax.runtime_event import RuntimeEvent\n',
                  'from minmax.runtime_event import RuntimeEvent\nfrom minmax.runtime_effect_sequence import RuntimeEffectEventAttempt\nfrom minmax.runtime_effect_stream import process_effect_variant_runtime_stream\nfrom minmax.runtime_effect_window import partition_runtime_effect_windows\n',
                  1,
              )
          anchor = '    def build_candidates(\n'
          method = '''    def active_triggered_named_buffs_history(\n        self,\n        build: PlayerBuild,\n        *,\n        active_bar: str,\n        attempts: tuple[RuntimeEffectEventAttempt, ...],\n        snapshot_time_seconds: float,\n    ) -> tuple[str, ...]:\n        snapshot = float(snapshot_time_seconds)\n        available = {\n            name.casefold(): effects\n            for _, name, effects in self._triggered_available(build)\n        }\n        attr = "BackBarSkills" if str(active_bar or "front").casefold() == "back" else "FrontBarSkills"\n        result: list[str] = []\n        for raw_name in list(getattr(build, attr))[:5]:\n            effects = available.get(str(raw_name or "").strip().casefold())\n            if not effects:\n                continue\n            for effect in effects:\n                buff = self._triggered_buff_name(effect)\n                if buff is None:\n                    continue\n                relevant = tuple(\n                    attempt for attempt in attempts\n                    if attempt.event.time_seconds <= snapshot\n                )\n                if not relevant:\n                    continue\n                stream = process_effect_variant_runtime_stream(relevant, effect)\n                partition = partition_runtime_effect_windows(\n                    stream.final_state.windows, at_time_seconds=snapshot\n                )\n                if any(window.effect_name == effect.name for window in partition.active):\n                    result.append(buff)\n        return tuple(dict.fromkeys(result))\n\n'''
          if 'def active_triggered_named_buffs_history(' not in text:
              text = text.replace(anchor, method + anchor, 1)
          p.write_text(text)

          # Tests for condition-aware streams and overlapping histories.
          p = Path('minmax/tests/test_runtime_effect_stream.py')
          text = p.read_text()
          if 'test_runtime_stream_carries_per_attempt_condition_context' not in text:
              text += '''\n\ndef test_runtime_stream_carries_per_attempt_condition_context():\n    effect = _effect(condition="target_below_half_health")\n    attempts = (\n        RuntimeEffectEventAttempt(\n            event=_event(time_seconds=1.0),\n            condition_context=frozenset(),\n        ),\n        RuntimeEffectEventAttempt(\n            event=_event(time_seconds=2.0, sequence=1),\n            condition_context=frozenset({"target_below_half_health"}),\n        ),\n    )\n    result = process_effect_variant_runtime_stream(attempts, effect)\n    assert result.activation_count == 1\n    assert result.steps[0].transition.activation.eligibility.reasons == ("condition_unsatisfied",)\n    assert result.steps[1].activated\n'''
          p.write_text(text)

          p = Path('services/tests/test_extreme_actual_heal_gear_runtime_buff_service.py')
          text = p.read_text()
          if 'test_gear_runtime_history_uses_surviving_window_at_snapshot' not in text:
              text += '''\n\ndef test_gear_runtime_history_uses_surviving_window_at_snapshot():\n    from minmax.runtime_effect_sequence import RuntimeEffectEventAttempt\n\n    service = ExtremeActualHealGearRuntimeBuffService(\n        "unused.db", repository=_Repository(), resolver=_Resolver()\n    )\n    attempts = (\n        RuntimeEffectEventAttempt(\n            RuntimeEvent(time_seconds=0.0, trigger="overheal_self_or_ally", source="first")\n        ),\n        RuntimeEffectEventAttempt(\n            RuntimeEvent(time_seconds=11.0, trigger="overheal_self_or_ally", source="second")\n        ),\n    )\n    active = service.resolve_history(\n        _five_piece("Self Proc Set"), active_bar="front", attempts=attempts, snapshot_time_seconds=14.0\n    )\n    expired = service.resolve_history(\n        _five_piece("Self Proc Set"), active_bar="front", attempts=attempts, snapshot_time_seconds=16.0\n    )\n    assert active.active_buffs == ("Major Courage",)\n    assert expired.active_buffs == ()\n'''
          p.write_text(text)

          p = Path('services/tests/test_extreme_actual_heal_skill_buff_candidate_service.py')
          text = p.read_text()
          if 'test_triggered_skill_history_uses_latest_surviving_window' not in text:
              text += '''\n\ndef test_triggered_skill_history_uses_latest_surviving_window():\n    from minmax.runtime_effect_sequence import RuntimeEffectEventAttempt\n    from minmax.runtime_event import RuntimeEvent\n\n    class HistoryRepository(_Repository):\n        @staticmethod\n        def available_skills(character_class=None):\n            _ = character_class\n            return ((7, "History Power"),)\n\n        @staticmethod\n        def resolve(ability_id):\n            return (\n                EffectVariant(\n                    name="major_sorcery",\n                    layer=EffectLayer.CAST,\n                    source="History Power",\n                    duration=10.0,\n                    trigger="critical_heal",\n                    target_type=SupportTargetType.SELF,\n                ),\n            )\n\n    service = ExtremeActualHealSkillBuffCandidateService("unused.db", repository=HistoryRepository())\n    build = _build()\n    build.FrontBarSkills[1] = "History Power"\n    attempts = (\n        RuntimeEffectEventAttempt(RuntimeEvent(time_seconds=0.0, trigger="critical_heal", source="first")),\n        RuntimeEffectEventAttempt(RuntimeEvent(time_seconds=11.0, trigger="critical_heal", source="second")),\n    )\n    assert service.active_triggered_named_buffs_history(\n        build, active_bar="front", attempts=attempts, snapshot_time_seconds=15.0\n    ) == ("Major Sorcery",)\n    assert service.active_triggered_named_buffs_history(\n        build, active_bar="front", attempts=attempts, snapshot_time_seconds=21.0\n    ) == ()\n'''
          p.write_text(text)

          p = Path('GAME_MECHANICS_FIELD_NOTES.md')
          text = p.read_text()
          heading = '## 2026-09-09 — Maximum-heal snapshots need ordered runtime history, not isolated proc events'
          if heading not in text:
              text += f'''\n\n---\n\n{heading}\n\nThe canonical runtime stream now carries each event attempt's deterministic chance roll and named condition evidence together. Extreme actual-heal skill and gear runtime services can evaluate ordered event histories and query the retained canonical active windows at one exact heal snapshot. This permits independently triggered buffs to overlap only when their real windows overlap, while cooldown, failed conditions, chance failures, refresh/stacking behavior, and exact end-time boundaries remain owned by the shared runtime engine.\n'''
          p.write_text(text)
          PY

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pydantic==2.13.4

      - name: Test patched head
        run: |
          python -m pytest \
            minmax/tests/test_runtime_effect_eligibility.py \
            minmax/tests/test_runtime_effect_activation.py \
            minmax/tests/test_runtime_effect_runtime.py \
            minmax/tests/test_runtime_effect_sequence.py \
            minmax/tests/test_runtime_effect_stream.py \
            services/tests/test_extreme_actual_heal_skill_buff_candidate_service.py \
            services/tests/test_extreme_actual_heal_gear_runtime_buff_service.py \
            services/tests/test_extreme_optimization_read_only_database.py

      - name: Commit rebase retest push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Jarakeen
          git config user.email jarakeene@gmail.com
          git add \
            minmax/runtime_effect_activation.py \
            minmax/runtime_effect_runtime.py \
            minmax/runtime_effect_sequence.py \
            minmax/runtime_effect_stream.py \
            services/extreme_actual_heal_skill_buff_candidate_service.py \
            services/extreme_actual_heal_gear_runtime_buff_service.py \
            minmax/tests/test_runtime_effect_stream.py \
            services/tests/test_extreme_actual_heal_skill_buff_candidate_service.py \
            services/tests/test_extreme_actual_heal_gear_runtime_buff_service.py \
            GAME_MECHANICS_FIELD_NOTES.md
          git commit -m "feat: evaluate Extreme heal runtime histories"
          git fetch origin phase13.2
          git rebase origin/phase13.2
          python -m pytest \
            minmax/tests/test_runtime_effect_eligibility.py \
            minmax/tests/test_runtime_effect_activation.py \
            minmax/tests/test_runtime_effect_runtime.py \
            minmax/tests/test_runtime_effect_sequence.py \
            minmax/tests/test_runtime_effect_stream.py \
            services/tests/test_extreme_actual_heal_skill_buff_candidate_service.py \
            services/tests/test_extreme_actual_heal_gear_runtime_buff_service.py \
            services/tests/test_extreme_optimization_read_only_database.py
          git push origin HEAD:phase13.2
