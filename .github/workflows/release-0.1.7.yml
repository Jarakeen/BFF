name: FoundryDock Patch Release 0.1.7

on:
  push:
    branches:
      - phase14
    paths:
      - ".github/workflows/release-0.1.7.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out phase14
        uses: actions/checkout@v4
        with:
          ref: phase14
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements-build.txt pytest
          if ($LASTEXITCODE -ne 0) { throw "Windows build dependencies failed to install" }

      - name: Run release regression tests
        shell: pwsh
        run: |
          python -m pytest `
            services/tests/test_finch_shared_import_service.py `
            services/tests/test_raid_coverage_catalog_expansion.py `
            services/tests/test_raid_plan_repository_revisions.py `
            services/tests/test_phase14_planning_workflow_roundtrip.py `
            services/tests/test_comp_build_persistence_service.py `
            tools/tests/test_build_release_user_database_seed.py `
            ui/tests/test_release_population_contract.py `
            ui/tests/test_raid_engine_workflow_handoffs.py `
            ui/tests/test_raid_plan_coverage_support.py `
            ui/tests/test_shared_plan_persistence_failsafes.py `
            ui/tests/test_assignment_save_stability.py `
            ui/tests/test_raid_plan_assignment_page.py `
            -q

      - name: Build friend package
        shell: pwsh
        run: |
          ./packaging/build_friend.ps1 -IncludeBroadcast

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path "dist/BFF-Friend/FoundryDock.exe"
          $crash = Join-Path (Split-Path $exe -Parent) "FoundryDock-crash.log"
          if (Test-Path $crash) { Remove-Item $crash -Force }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) {
            if (Test-Path $crash) {
              Get-Content $crash -Raw
            }
            throw "Packaged FoundryDock exited during startup smoke test."
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Packaged FoundryDock remained running through startup smoke test."

          $userDb = Join-Path $env:LOCALAPPDATA "FoundryDock\foundrydock.db"
          if (-not (Test-Path $userDb -PathType Leaf)) {
            throw "Packaged first run did not provision foundrydock.db from the release seed."
          }
          python -c "import sqlite3,sys; db=sqlite3.connect(sys.argv[1]); assert db.execute('select count(*) from roster_member').fetchone()[0] >= 12; assert db.execute('select count(*) from team').fetchone()[0] >= 1; assert db.execute('select count(*) from raid_plan').fetchone()[0] >= 1; print('Populated first-run user database smoke test: PASS')" $userDb
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged first-run user database is not populated."
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item dist/BFF-Friend.zip dist/FoundryDock-0.1.7.zip -Force
          if (-not (Test-Path dist/FoundryDock-update.zip)) {
            throw "FoundryDock-update.zip was not produced."
          }

      - name: Create patch release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phase14.1.7 --yes --cleanup-tag 2>$null
          gh release create phase14.1.7 `
            dist/FoundryDock-0.1.7.zip `
            dist/FoundryDock-update.zip `
            dist/FoundryDock-update.zip.sha256 `
            --target "${{ github.sha }}" `
            --title "FoundryDock 0.1.7" `
            --notes "Patch release for Finch collaboration and raid-planning persistence. Shared Teams/Raid Plans now use foundrydock.db end to end; Assignments/Comp/Coverage handoffs require verified saved checkpoints; Raid Plan revisions and whole-database pre-save snapshots protect save points; shared planned skills survive Copy to Local; Coverage adds current BTV-style support effects and never renders empty. Fresh installs receive populated reference planning data. Existing user databases are never replaced."

