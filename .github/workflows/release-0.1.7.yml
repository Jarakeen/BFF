name: FoundryDock Patch Release 0.1.7

on:
  push:
    branches:
      - phase14
    paths:
      - ".github/workflows/release-0.1.7.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out phase14
        uses: actions/checkout@v4
        with:
          ref: phase14
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements-build.txt pytest
          if ($LASTEXITCODE -ne 0) { throw "Windows build dependencies failed to install" }

      - name: Run Finch shared import regression tests
        shell: pwsh
        run: |
          python -m pytest services/tests/test_finch_shared_import_service.py -q

      - name: Build friend package
        shell: pwsh
        run: |
          ./packaging/build_friend.ps1 -IncludeBroadcast

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path "dist/BFF-Friend/FoundryDock.exe"
          $crash = Join-Path (Split-Path $exe -Parent) "FoundryDock-crash.log"
          if (Test-Path $crash) { Remove-Item $crash -Force }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) {
            if (Test-Path $crash) {
              Get-Content $crash -Raw
            }
            throw "Packaged FoundryDock exited during startup smoke test."
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Packaged FoundryDock remained running through startup smoke test."

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item dist/BFF-Friend.zip dist/FoundryDock-0.1.7.zip -Force
          if (-not (Test-Path dist/FoundryDock-update.zip)) {
            throw "FoundryDock-update.zip was not produced."
          }

      - name: Create patch release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phase14.1.7 --yes --cleanup-tag 2>$null
          gh release create phase14.1.7 `
            dist/FoundryDock-0.1.7.zip `
            dist/FoundryDock-update.zip `
            dist/FoundryDock-update.zip.sha256 `
            --target "${{ github.sha }}" `
            --title "FoundryDock 0.1.7" `
            --notes "Patch release for Finch shared collaboration. Fixes current Finch Team schema v3 and Raid Plan schema v7 snapshots, and makes all Finch collaboration surfaces use the same canonical packaged settings/API credential path. Includes packaged EXE startup smoke test. No user database replacement."

# rebuild-after-finch-settings-path
