name: Extreme Role Roadmap Once

on:
  push:
    branches: [phase13]
    paths:
      - .github/workflows/extreme-role-roadmap-once.yml

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase13.2
          fetch-depth: 0

      - name: Insert role-complete Extreme roadmap
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin phase13
          git show origin/phase13:.github/extreme_role_roadmap_payload.md > /tmp/extreme-role-roadmap.md
          python - <<'PY'
          from pathlib import Path

          path = Path('MASTER_ROADMAP.md')
          text = path.read_text()
          payload = Path('/tmp/extreme-role-roadmap.md').read_text().rstrip() + '\n'
          heading = '#### Extreme Builds role-complete completion roadmap'
          anchor = 'The output remains a **best reviewed lower bound**, not an unsupported claim of a globally optimal ESO build. Broader class passive, gear, race, Mundus, CP, enchantment, proc, runtime, and encounter coverage must continue to expand before that boundary changes.\n'
          if heading not in text:
              if anchor not in text:
                  raise SystemExit('Extreme roadmap anchor not found')
              text = text.replace(anchor, anchor + '\n' + payload, 1)
              path.write_text(text)
          PY
          grep -n "Extreme Builds role-complete completion roadmap" MASTER_ROADMAP.md
          git diff --check

      - name: Commit rebase and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Jarakeen
          git config user.email jarakeene@gmail.com
          git add MASTER_ROADMAP.md
          git commit -m "docs: add role-complete Extreme build roadmap"
          git fetch origin phase13.2
          git rebase origin/phase13.2
          grep -n "Extreme Builds role-complete completion roadmap" MASTER_ROADMAP.md
          git diff HEAD^ --check
          git push origin HEAD:phase13.2
