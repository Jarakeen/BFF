name: Extreme Snapshot State Once

on:
  push:
    branches: [phase13]
    paths:
      - .github/workflows/extreme-snapshot-state-once.yml

permissions:
  contents: write

jobs:
  patch-test-rebase-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase13.2
          fetch-depth: 0

      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin phase13
          git show origin/phase13:.github/extreme_snapshot_state_patch.py > /tmp/extreme_snapshot_state_patch.py
          python /tmp/extreme_snapshot_state_patch.py
          git diff --check

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pydantic==2.13.4

      - name: Test patched head
        run: |
          python -m pytest services/tests/test_extreme_runtime_snapshot_combat_state_service.py services/tests/test_extreme_conditional_actual_heal_optimization_service.py services/tests/test_extreme_actual_heal_skill_buff_candidate_service.py services/tests/test_extreme_actual_heal_gear_runtime_buff_service.py minmax/tests/test_runtime_effect_stream.py services/tests/test_extreme_optimization_read_only_database.py

      - name: Commit rebase retest push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Jarakeen
          git config user.email jarakeene@gmail.com
          git add services/extreme_runtime_snapshot_combat_state_service.py services/extreme_conditional_actual_heal_optimization_service.py services/tests/test_extreme_runtime_snapshot_combat_state_service.py GAME_MECHANICS_FIELD_NOTES.md
          git commit -m "feat: project shared Extreme runtime snapshots"
          git fetch origin phase13.2
          git rebase origin/phase13.2
          python -m pytest services/tests/test_extreme_runtime_snapshot_combat_state_service.py services/tests/test_extreme_conditional_actual_heal_optimization_service.py services/tests/test_extreme_actual_heal_skill_buff_candidate_service.py services/tests/test_extreme_actual_heal_gear_runtime_buff_service.py minmax/tests/test_runtime_effect_stream.py services/tests/test_extreme_optimization_read_only_database.py
          git push origin HEAD:phase13.2