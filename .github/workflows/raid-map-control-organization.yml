name: Raid Map control organization

on:
  push:
    branches: [phase14]
    paths:
      - "ui/components/encounter_board.py"
      - "ui/encounter_board_formation_support.py"
      - "ui/encounter_board_custom_labels_support.py"
      - "ui/encounter_position_timeline_support.py"
      - "ui/encounter_position_gif_export_support.py"
      - "ui/tests/test_raid_map_control_organization.py"
      - "ui/tests/test_encounter_board_custom_labels_support.py"
      - "ui/tests/test_encounter_board_formation_support.py"
      - "ui/tests/test_encounter_position_timeline_support.py"
      - "ui/tests/test_encounter_position_gif_export_support.py"
      - ".github/workflows/raid-map-control-organization.yml"
  workflow_dispatch:

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PySide6 Pillow
      - name: Run Raid Map control tests
        run: |
          pytest \
            ui/tests/test_raid_map_control_organization.py \
            ui/tests/test_encounter_board_custom_labels_support.py \
            ui/tests/test_encounter_board_formation_support.py \
            ui/tests/test_encounter_position_timeline_support.py \
            ui/tests/test_encounter_position_gif_export_support.py -q
