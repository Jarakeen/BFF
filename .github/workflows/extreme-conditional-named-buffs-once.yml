name: Extreme Conditional Named Buffs Once

on:
  push:
    branches:
      - phase13
    paths:
      - .github/workflows/extreme-conditional-named-buffs-once.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current phase13.2
        uses: actions/checkout@v4
        with:
          ref: phase13.2
          fetch-depth: 0

      - name: Patch explicit named-buff scenario support
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('services/extreme_conditional_actual_heal_optimization_service.py')
          text = path.read_text(encoding='utf-8')

          old = '''        active_crux: int | None = None,\n        restoration_heavy_state: ExtremeRestorationHeavyCombatStateService | None = None,'''
          new = '''        active_crux: int | None = None,\n        active_buffs: tuple[str, ...] = (),\n        restoration_heavy_state: ExtremeRestorationHeavyCombatStateService | None = None,'''
          if old not in text:
              raise SystemExit('constructor active_crux insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        self.healer_has_negative_effect = healer_has_negative_effect\n        self.active_crux = active_crux\n        self.restoration_heavy_state = restoration_heavy_state'''
          new = '''        self.healer_has_negative_effect = healer_has_negative_effect\n        self.active_crux = active_crux\n        self.active_buffs = tuple(\n            dict.fromkeys(\n                name\n                for raw_name in active_buffs\n                if (name := str(raw_name or "").strip())\n            )\n        )\n        self.restoration_heavy_state = restoration_heavy_state'''
          if old not in text:
              raise SystemExit('constructor assignment insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        if self.active_crux is not None:\n            scenarios.append(\n                f"explicit active Crux count {self.active_crux}; "\n                "Healing Tides requires canonical legality proof"\n            )\n        if self.sacred_ground_window_active:'''
          new = '''        if self.active_crux is not None:\n            scenarios.append(\n                f"explicit active Crux count {self.active_crux}; "\n                "Healing Tides requires canonical legality proof"\n            )\n        if self.active_buffs:\n            scenarios.append(\n                "explicit active named buffs: " + ", ".join(self.active_buffs)\n            )\n        if self.sacred_ground_window_active:'''
          if old not in text:
              raise SystemExit('search-scope insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        active_buffs: list[str] = []\n        unresolved: list[str] = []'''
          new = '''        active_buffs: list[str] = list(self.active_buffs)\n        unresolved: list[str] = []'''
          if old not in text:
              raise SystemExit('combat-state active-buff insertion point not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('services/tests/test_extreme_conditional_actual_heal_optimization_service.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_conditional_optimizer_routes_explicit_named_buffs_to_every_context'
          if marker not in tests:
              tests += '''\n\ndef test_conditional_optimizer_routes_explicit_named_buffs_to_every_context(monkeypatch):\n    _install_progression_adapter(monkeypatch)\n    optimizer = _Optimizer()\n    service = ExtremeConditionalActualHealOptimizationService(\n        target_health_fraction=0.29,\n        active_buffs=("Major Sorcery", "Minor Brutality", "Major Sorcery", ""),\n        optimizer=optimizer,\n        healing_events=_ConditionalHealingEvents(),\n    )\n\n    result = service.optimize(\n        PlayerBuild(BuildName="Named Buff Emergency"),\n        "blessing_of_protection",\n        max_passes=2,\n    )\n\n    assert service.active_buffs == ("Major Sorcery", "Minor Brutality")\n    assert optimizer.context_factory.combat_states\n    assert all(\n        state.active_buffs == ("Major Sorcery", "Minor Brutality")\n        for state in optimizer.context_factory.combat_states\n    )\n    assert result.search_scope[1] == (\n        "explicit active named buffs: Major Sorcery, Minor Brutality"\n    )\n\n\ndef test_conditional_optimizer_combines_explicit_named_buffs_with_triggered_mending(monkeypatch):\n    _install_progression_adapter(monkeypatch)\n    optimizer = _Optimizer()\n    service = ExtremeConditionalActualHealOptimizationService(\n        target_health_fraction=0.29,\n        active_buffs=("Major Sorcery",),\n        fully_charged_restoration_heavy_attack_completed=True,\n        restoration_heavy_state=_RestorationHeavyState(),\n        optimizer=optimizer,\n        healing_events=_ConditionalHealingEvents(),\n    )\n\n    service.optimize(\n        PlayerBuild(BuildName="Combined Buff Emergency"),\n        "blessing_of_protection",\n        max_passes=1,\n    )\n\n    assert optimizer.context_factory.combat_states\n    assert all(\n        state.active_buffs == ("Major Sorcery", "Major Mending")\n        for state in optimizer.context_factory.combat_states\n    )\n'''
              test_path.write_text(tests, encoding='utf-8')

          notes_path = Path('GAME_MECHANICS_FIELD_NOTES.md')
          notes = notes_path.read_text(encoding='utf-8')
          heading = '## 2026-09-09 — Supported named buffs still need optimizer scenario plumbing'
          if heading not in notes:
              notes += f'''\n\n---\n\n{heading}\n\nThe general combat-state calculator already knew how to apply named buffs such as **Major Sorcery** to raw coefficient inputs like Spell Damage. The conditional MOST Actual Heal optimizer could still miss that bonus because it only constructed combat state from its own trigger-specific services and had no explicit named-buff scenario input.\n\n**Layman’s version:** a mechanic can be perfectly implemented in the calculator and still disappear if the optimizer never carries the active-buff evidence into that calculator. “Supported” and “actually reachable by this optimizer” are separate questions.\n\n**For BFF:** conditional named buffs are now explicit scenario evidence. They are never granted automatically, and they share the same canonical `CombatState` path as trigger-proven buffs such as Essence Drain Major Mending.\n'''
              notes_path.write_text(notes, encoding='utf-8')
          PY

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pydantic==2.13.4

      - name: Run focused conditional buff tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            services/tests/test_extreme_conditional_actual_heal_optimization_service.py \
            minmax/tests/test_named_combat_buffs.py \
            services/tests/test_extreme_optimization_read_only_database.py

      - name: Commit and push if phase13.2 is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin phase13.2
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/phase13.2)" || { echo 'phase13.2 moved during named-buff repair; refusing stale push'; exit 1; }
          git config user.name "Jarakeen"
          git config user.email "jarakeene@gmail.com"
          git add \
            services/extreme_conditional_actual_heal_optimization_service.py \
            services/tests/test_extreme_conditional_actual_heal_optimization_service.py \
            GAME_MECHANICS_FIELD_NOTES.md
          git diff --cached --stat
          git commit -m "feat: carry named buffs into Extreme heal scenarios"
          git push origin HEAD:phase13.2
