name: Phase 14 Finch focused tests

on:
  push:
    branches: [phase14]
    paths:
      - "services/finch_api_client.py"
      - "services/finch_shared_publish_service.py"
      - "services/tests/test_finch_api_client.py"
      - "services/tests/test_finch_shared_publish_service.py"
      - "ui/themed_roster_page.py"
      - "ui/raid_plan_persistence_page.py"
      - "ui/tests/test_finch_shared_publish_actions.py"
      - ".github/workflows/finch-focused-tests.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run focused Finch sharing tests
        run: |
          python -m pytest \
            services/tests/test_finch_api_client.py \
            services/tests/test_finch_shared_publish_service.py \
            ui/tests/test_finch_shared_publish_actions.py -q
