name: Extreme Potion Candidate Discovery Once

on:
  push:
    branches:
      - phase13
    paths:
      - .github/workflows/extreme-potion-candidate-discovery-once.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current phase13.2
        uses: actions/checkout@v4
        with:
          ref: phase13.2
          fetch-depth: 0

      - name: Patch potion candidate discovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          base_path = Path('services/extreme_actual_heal_optimization_service.py')
          base = base_path.read_text(encoding='utf-8')
          old = '''            if self.arena_weapon_packages is not None:\n                candidates.extend(\n                    self.arena_weapon_packages.build_candidates(\n                        current,\n                        character_id=character_id,\n                        baseline_build_id=candidate_build_id,\n                        active_bar=active_bar,\n                    )\n                )\n\n            for candidate in candidates:'''
          new = '''            if self.arena_weapon_packages is not None:\n                candidates.extend(\n                    self.arena_weapon_packages.build_candidates(\n                        current,\n                        character_id=character_id,\n                        baseline_build_id=candidate_build_id,\n                        active_bar=active_bar,\n                    )\n                )\n            candidates.extend(\n                self._additional_candidates(\n                    current,\n                    progression=progression,\n                    character_id=character_id,\n                    baseline_build_id=candidate_build_id,\n                    entity_id=normalized_entity,\n                    active_bar=active_bar,\n                )\n            )\n\n            for candidate in candidates:'''
          if old not in base:
              raise SystemExit('base candidate extension insertion point not found')
          base = base.replace(old, new, 1)

          marker = '''    @staticmethod\n    def _evaluation_key('''
          hook = '''    def _additional_candidates(\n        self,\n        baseline_build: PlayerBuild,\n        *,\n        progression: CharacterProgression,\n        character_id: str,\n        baseline_build_id: str,\n        entity_id: str,\n        active_bar: str,\n    ) -> tuple[BuildCandidate, ...]:\n        _ = (\n            baseline_build,\n            progression,\n            character_id,\n            baseline_build_id,\n            entity_id,\n            active_bar,\n        )\n        return ()\n\n'''
          if 'def _additional_candidates(' not in base:
              if marker not in base:
                  raise SystemExit('base hook insertion point not found')
              base = base.replace(marker, hook + marker, 1)
          base_path.write_text(base, encoding='utf-8')

          service_path = Path('services/extreme_actual_heal_potion_candidate_service.py')
          service_path.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom minmax.build_candidate import BuildCandidate\nfrom minmax.combat_effect_semantics import GameUpdate\nfrom minmax.alchemy_potion_buff_semantics import potion_buff_for_trait\nfrom models.build_model import PlayerBuild\nfrom services.extreme_complete_optimization_service import ExtremeCompleteOptimizationService\nfrom services.potion_choice_service import PotionChoiceService\n\n\nclass ExtremeActualHealPotionCandidateService:\n    """Generate legal saved-potion family candidates for an explicit use window.\n\n    Candidate generation proves only that a canonical potion family exists and\n    carries at least one named combat buff. Whether that buff is active at the\n    scored snapshot remains the responsibility of PotionUseEventResolver,\n    PotionCadence, Medicinal Use progression, and the caller's elapsed time.\n    """\n\n    def __init__(\n        self,\n        processed_path: str | Path | None = None,\n        *,\n        choice_service: PotionChoiceService | None = None,\n    ) -> None:\n        if choice_service is None:\n            path = Path(processed_path) if processed_path is not None else (\n                Path(__file__).resolve().parents[1]\n                / "data"\n                / "processed"\n                / "alchemy_effects.json"\n            )\n            choice_service = PotionChoiceService(path, game_update=GameUpdate.U50)\n        self.choice_service = choice_service\n\n    def build_candidates(\n        self,\n        baseline_build: PlayerBuild,\n        *,\n        character_id: str,\n        baseline_build_id: str,\n    ) -> tuple[BuildCandidate, ...]:\n        before = " ".join(str(baseline_build.Potion or "").strip().split())\n        result: list[BuildCandidate] = []\n        for choice in self.choice_service.list_choices():\n            label = " ".join(str(choice.label or "").strip().split())\n            if not label or label.casefold() == before.casefold():\n                continue\n            named_buffs = tuple(\n                dict.fromkeys(\n                    buff\n                    for trait in choice.traits\n                    if (buff := potion_buff_for_trait(trait, game_update=GameUpdate.U50))\n                )\n            )\n            if not named_buffs:\n                continue\n\n            build = PlayerBuild.from_dict(baseline_build.to_dict())\n            build.Potion = label\n            result.append(\n                ExtremeCompleteOptimizationService._direct_candidate(\n                    build,\n                    character_id=character_id,\n                    baseline_build_id=baseline_build_id,\n                    token=f"actual-heal-potion:{choice.canonical_id}",\n                    path="Potion",\n                    before=before,\n                    after={\n                        "label": label,\n                        "canonical_id": choice.canonical_id,\n                        "traits": tuple(choice.traits),\n                        "named_buffs": named_buffs,\n                    },\n                    source="extreme:actual-heal:potion-family",\n                )\n            )\n        return tuple(result)\n''', encoding='utf-8')

          conditional_path = Path('services/extreme_conditional_actual_heal_optimization_service.py')
          conditional = conditional_path.read_text(encoding='utf-8')
          old = '''from services.extreme_actual_heal_optimization_service import (\n    ExtremeActualHealOptimizationResult,\n    ExtremeActualHealOptimizationService,\n)'''
          new = old + '''\nfrom services.extreme_actual_heal_potion_candidate_service import (\n    ExtremeActualHealPotionCandidateService,\n)'''
          if 'ExtremeActualHealPotionCandidateService' not in conditional:
              if old not in conditional:
                  raise SystemExit('conditional import insertion point not found')
              conditional = conditional.replace(old, new, 1)

          old = '''        potion_elapsed_seconds: float | None = None,\n        potion_use_resolver: PotionUseEventResolver | None = None,\n        restoration_heavy_state: ExtremeRestorationHeavyCombatStateService | None = None,'''
          new = '''        potion_elapsed_seconds: float | None = None,\n        potion_use_resolver: PotionUseEventResolver | None = None,\n        potion_candidates: ExtremeActualHealPotionCandidateService | None = None,\n        restoration_heavy_state: ExtremeRestorationHeavyCombatStateService | None = None,'''
          if old not in conditional:
              raise SystemExit('conditional constructor insertion point not found')
          conditional = conditional.replace(old, new, 1)

          old = '''        self.potion_use_resolver = potion_use_resolver\n        self.restoration_heavy_state = restoration_heavy_state'''
          new = '''        self.potion_use_resolver = potion_use_resolver\n        self.potion_candidates = potion_candidates\n        self.restoration_heavy_state = restoration_heavy_state'''
          if old not in conditional:
              raise SystemExit('conditional potion candidate assignment point not found')
          conditional = conditional.replace(old, new, 1)

          marker = '''    def _restoration_combat_state(\n'''
          hook = '''    def _additional_candidates(\n        self,\n        baseline_build: PlayerBuild,\n        *,\n        progression: CharacterProgression,\n        character_id: str,\n        baseline_build_id: str,\n        entity_id: str,\n        active_bar: str,\n    ):\n        _ = progression, entity_id, active_bar\n        if self.potion_elapsed_seconds is None:\n            return ()\n        service = self.potion_candidates\n        if service is None:\n            service = ExtremeActualHealPotionCandidateService()\n            self.potion_candidates = service\n        return service.build_candidates(\n            baseline_build,\n            character_id=character_id,\n            baseline_build_id=baseline_build_id,\n        )\n\n'''
          if 'def _additional_candidates(' not in conditional:
              if marker not in conditional:
                  raise SystemExit('conditional additional-candidates insertion point not found')
              conditional = conditional.replace(marker, hook + marker, 1)
          conditional_path.write_text(conditional, encoding='utf-8')

          test_service = Path('services/tests/test_extreme_actual_heal_potion_candidate_service.py')
          test_service.write_text('''from types import SimpleNamespace\n\nfrom models.build_model import PlayerBuild\nfrom services.extreme_actual_heal_potion_candidate_service import (\n    ExtremeActualHealPotionCandidateService,\n)\n\n\nclass _Choices:\n    @staticmethod\n    def list_choices():\n        return [\n            SimpleNamespace(\n                label="Increase Spell Power + Restore Magicka",\n                canonical_id="alchemy_family:u50:spell_power",\n                traits=("Increase Spell Power", "Restore Magicka"),\n            ),\n            SimpleNamespace(\n                label="Unstoppable",\n                canonical_id="alchemy_family:u50:unstoppable",\n                traits=("Unstoppable",),\n            ),\n        ]\n\n\ndef test_potion_candidate_service_emits_only_named_buff_families():\n    service = ExtremeActualHealPotionCandidateService(choice_service=_Choices())\n    candidates = service.build_candidates(\n        PlayerBuild(BuildName="Baseline", Potion=""),\n        character_id="char-1",\n        baseline_build_id="build-1",\n    )\n\n    assert len(candidates) == 1\n    candidate = candidates[0]\n    assert candidate.candidate_build.Potion == "Increase Spell Power + Restore Magicka"\n    assert candidate.changes[0].path == "Potion"\n    assert candidate.changes[0].after["named_buffs"] == ["Major Sorcery", "Major Intellect"]\n\n\ndef test_potion_candidate_service_skips_current_selection():\n    service = ExtremeActualHealPotionCandidateService(choice_service=_Choices())\n    candidates = service.build_candidates(\n        PlayerBuild(\n            BuildName="Baseline",\n            Potion="Increase Spell Power + Restore Magicka",\n        ),\n        character_id="char-1",\n        baseline_build_id="build-1",\n    )\n\n    assert candidates == ()\n''', encoding='utf-8')

          conditional_test_path = Path('services/tests/test_extreme_conditional_actual_heal_optimization_service.py')
          tests = conditional_test_path.read_text(encoding='utf-8')
          marker = 'class _PotionCandidates:'
          if marker not in tests:
              insert_at = tests.index('\ndef _install_progression_adapter')
              helper = '''\n\nclass _PotionCandidates:\n    def __init__(self):\n        self.calls = []\n\n    def build_candidates(self, baseline_build, *, character_id, baseline_build_id):\n        self.calls.append((baseline_build.Potion, character_id, baseline_build_id))\n        build = PlayerBuild.from_dict(baseline_build.to_dict())\n        build.Potion = "Increase Spell Power"\n        return (\n            base_module.ExtremeCompleteOptimizationService._direct_candidate(\n                build,\n                character_id=character_id,\n                baseline_build_id=baseline_build_id,\n                token="test-potion-candidate",\n                path="Potion",\n                before=baseline_build.Potion,\n                after="Increase Spell Power",\n                source="test:potion",\n            ),\n        )\n'''
              tests = tests[:insert_at] + helper + tests[insert_at:]

          marker = 'def test_conditional_optimizer_discovers_potion_candidates_only_for_explicit_window'
          if marker not in tests:
              tests += '''\n\ndef test_conditional_optimizer_discovers_potion_candidates_only_for_explicit_window():\n    candidates = _PotionCandidates()\n    active = ExtremeConditionalActualHealOptimizationService(\n        target_health_fraction=0.29,\n        potion_elapsed_seconds=0.0,\n        potion_candidates=candidates,\n        optimizer=_Optimizer(),\n        healing_events=_ConditionalHealingEvents(),\n    )\n    proposed = active._additional_candidates(\n        PlayerBuild(BuildName="Candidate Discovery", Potion="Restore Magicka"),\n        progression=CharacterProgression(passive_ranks={"Medicinal Use": 3}),\n        character_id="char-1",\n        baseline_build_id="build-1",\n        entity_id="blessing_of_protection",\n        active_bar="front",\n    )\n\n    assert len(proposed) == 1\n    assert proposed[0].candidate_build.Potion == "Increase Spell Power"\n    assert candidates.calls\n\n    inactive = ExtremeConditionalActualHealOptimizationService(\n        target_health_fraction=0.29,\n        potion_candidates=candidates,\n        optimizer=_Optimizer(),\n        healing_events=_ConditionalHealingEvents(),\n    )\n    assert inactive._additional_candidates(\n        PlayerBuild(BuildName="No Window", Potion="Restore Magicka"),\n        progression=CharacterProgression(passive_ranks={"Medicinal Use": 3}),\n        character_id="char-1",\n        baseline_build_id="build-1",\n        entity_id="blessing_of_protection",\n        active_bar="front",\n    ) == ()\n'''
              conditional_test_path.write_text(tests, encoding='utf-8')

          notes_path = Path('GAME_MECHANICS_FIELD_NOTES.md')
          notes = notes_path.read_text(encoding='utf-8')
          heading = '## 2026-09-09 — Extreme may discover potion families only inside an explicit potion-use scenario'
          if heading not in notes:
              notes += f'''\n\n---\n\n{heading}\n\nThe Extreme MOST Actual Heal search may compare canonical potion families when, and only when, the caller has explicitly requested a potion-use snapshot. Candidate generation proves potion-family availability; the existing potion event/cadence layer still proves whether each named buff is actually active at the requested elapsed time.\n\n**Layman’s version:** the optimizer is allowed to shop the potion shelf, but only after the scenario says a potion was actually used. It still cannot treat a selected bottle as a permanent character stat.\n\n**For BFF:** standing heal optimization remains unchanged. Conditional potion-window optimization can now discover a stronger legal potion source instead of requiring the caller to preselect the winning potion.\n'''
              notes_path.write_text(notes, encoding='utf-8')
          PY

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pydantic==2.13.4

      - name: Run focused Extreme discovery tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            services/tests/test_extreme_actual_heal_potion_candidate_service.py \
            services/tests/test_extreme_conditional_actual_heal_optimization_service.py \
            services/tests/test_extreme_actual_heal_optimization_service.py \
            minmax/tests/test_potion_active_window.py \
            minmax/tests/test_potion_cadence.py \
            minmax/tests/test_potion_use_event.py \
            minmax/tests/test_named_combat_buffs.py \
            services/tests/test_extreme_optimization_read_only_database.py

      - name: Commit and push if phase13.2 is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin phase13.2
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/phase13.2)" || { echo 'phase13.2 moved during potion candidate discovery; refusing stale push'; exit 1; }
          git config user.name "Jarakeen"
          git config user.email "jarakeene@gmail.com"
          git add \
            services/extreme_actual_heal_optimization_service.py \
            services/extreme_conditional_actual_heal_optimization_service.py \
            services/extreme_actual_heal_potion_candidate_service.py \
            services/tests/test_extreme_actual_heal_potion_candidate_service.py \
            services/tests/test_extreme_conditional_actual_heal_optimization_service.py \
            GAME_MECHANICS_FIELD_NOTES.md
          git diff --cached --stat
          git commit -m "feat: discover potion sources for Extreme heals"
          git push origin HEAD:phase13.2
