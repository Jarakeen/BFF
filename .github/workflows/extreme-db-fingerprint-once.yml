name: Extreme Shadow Repair Once

on:
  push:
    branches:
      - phase13
    paths:
      - .github/workflows/extreme-db-fingerprint-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current phase13.2
        uses: actions/checkout@v4
        with:
          ref: phase13.2
          fetch-depth: 0

      - name: Restore and patch Extreme Shadow path
        shell: bash
        run: |
          set -euo pipefail
          git checkout 6f635f46859c635146d64c09f6a76b56d9469d2b -- minmax/gear_stat_inputs.py

          python - <<'PY'
          from pathlib import Path
          import sqlite3

          gear_path = Path('minmax/gear_stat_inputs.py')
          gear = gear_path.read_text(encoding='utf-8')

          core_old = '    StatId.CRITICAL_DAMAGE: "critical_damage",\n    StatId.CRITICAL_RESISTANCE: "critical_resistance",'
          core_new = '    StatId.CRITICAL_DAMAGE: "critical_damage",\n    StatId.CRITICAL_HEALING: "critical_healing",\n    StatId.CRITICAL_RESISTANCE: "critical_resistance",'
          if core_old not in gear:
              raise SystemExit('CORE_FIELDS insertion point not found')
          gear = gear.replace(core_old, core_new, 1)

          ratio_old = 'RATIO_POINT_STATS = {\n    StatId.CRITICAL_DAMAGE,\n    StatId.HEALING_DONE,'
          ratio_new = 'RATIO_POINT_STATS = {\n    StatId.CRITICAL_DAMAGE,\n    StatId.CRITICAL_HEALING,\n    StatId.HEALING_DONE,'
          if ratio_old not in gear:
              raise SystemExit('RATIO_POINT_STATS insertion point not found')
          gear = gear.replace(ratio_old, ratio_new, 1)
          gear_path.write_text(gear, encoding='utf-8')

          test_path = Path('minmax/tests/test_shadow_mundus_critical_healing.py')
          test = test_path.read_text(encoding='utf-8')
          if 'from models.build_model import PlayerBuild\n' not in test:
              test = test.replace(
                  'from minmax.effects import EffectOperation, EffectUnit\n',
                  'from models.build_model import PlayerBuild\nfrom minmax.effects import EffectOperation, EffectUnit\nfrom minmax.gear_stat_inputs import GearCalculationInputs\n',
                  1,
              )
          if 'from minmax.static_build_inputs import StaticBuildInputResolver\n' not in test:
              test = test.replace(
                  'from minmax.mundus_repository import MundusRepository\n',
                  'from minmax.mundus_repository import MundusRepository\nfrom minmax.static_build_inputs import StaticBuildInputResolver\n',
                  1,
              )

          marker = 'def test_shadow_static_build_inputs_keep_critical_healing'
          if marker not in test:
              test += '''\n\ndef test_shadow_static_build_inputs_keep_critical_healing(tmp_path):\n    repository = MundusRepository(tmp_path / "shadow.db")\n    resolver = StaticBuildInputResolver(mundus_repository=repository)\n\n    result = resolver.apply(GearCalculationInputs(), PlayerBuild(Mundus="The Shadow"))\n\n    assert result.unresolved == ()\n    critical_damage = result.core.critical_damage.additive_after_percent\n    critical_healing = result.core.critical_healing.additive_after_percent\n    assert [(item.label, item.value) for item in critical_damage] == [("Mundus: The Shadow", 0.11)]\n    assert [(item.label, item.value) for item in critical_healing] == [("Mundus: The Shadow", 0.11)]\n'''
          test_path.write_text(test, encoding='utf-8')

          db = sqlite3.connect('data/eso.db')
          before = db.execute('''
              SELECT me.id, me.value, me.supported, me.notes
              FROM mundus_effect AS me
              JOIN mundus_stone AS ms ON ms.id = me.mundus_id
              WHERE ms.name = 'The Shadow' AND me.stat_id = 'critical_healing'
          ''').fetchall()
          if not before:
              raise SystemExit('The Shadow critical_healing row not found')
          if any(float(value) != 11.0 for _id, value, _supported, _notes in before):
              raise SystemExit(f'Unexpected Shadow critical_healing value: {before!r}')

          db.execute('''
              UPDATE mundus_effect
              SET supported = 1, notes = ''
              WHERE stat_id = 'critical_healing'
                AND mundus_id IN (SELECT id FROM mundus_stone WHERE name = 'The Shadow')
          ''')
          db.commit()
          after = db.execute('''
              SELECT me.id, me.value, me.supported, me.notes
              FROM mundus_effect AS me
              JOIN mundus_stone AS ms ON ms.id = me.mundus_id
              WHERE ms.name = 'The Shadow' AND me.stat_id = 'critical_healing'
          ''').fetchall()
          integrity = db.execute('PRAGMA integrity_check').fetchone()[0]
          db.close()
          if integrity != 'ok':
              raise SystemExit(f'SQLite integrity failure: {integrity}')
          if any(int(supported) != 1 or str(notes) != '' for _id, _value, supported, notes in after):
              raise SystemExit(f'Shadow row repair failed: {after!r}')
          print('Shadow DB before:', before)
          print('Shadow DB after:', after)
          print('SQLite integrity:', integrity)

          notes_path = Path('GAME_MECHANICS_FIELD_NOTES.md')
          notes = notes_path.read_text(encoding='utf-8')
          heading = '## 2026-09-09 — Critical Healing can exist in data and still vanish before calculation'
          if heading not in notes:
              notes += f'''\n\n---\n\n{heading}\n\nThe Shadow correctly carried an **11% Critical Healing** effect in the Mundus data, and the core stat calculator already knew how to calculate Critical Healing. The bonus was still missing from Extreme healing results because the static build-input router did not include `critical_healing` in its core-field and ratio-point mappings.\n\n**Layman’s version:** having the right number in the database is not enough. Every layer between the database and the final heal has to know how to carry that number forward. One missing routing entry can make a valid bonus quietly disappear.\n\n**For BFF:** static combat stats need end-to-end regression tests that prove a mechanic survives repository resolution, input routing, and calculation.\n'''
              notes_path.write_text(notes, encoding='utf-8')
          PY

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.1.1 pydantic==2.13.4

      - name: Run focused Extreme tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            minmax/tests/test_shadow_mundus_critical_healing.py \
            minmax/tests/test_phase2_static_build_inputs.py \
            services/tests/test_extreme_*.py

      - name: Commit repaired Extreme Shadow path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jarakeen"
          git config user.email "jarakeene@gmail.com"
          git add minmax/gear_stat_inputs.py minmax/tests/test_shadow_mundus_critical_healing.py data/eso.db GAME_MECHANICS_FIELD_NOTES.md
          git diff --cached --stat
          git commit -m "fix: apply Shadow critical healing in Extreme builds"
          git push origin HEAD:phase13.2
