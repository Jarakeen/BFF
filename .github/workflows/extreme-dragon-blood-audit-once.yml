name: Extreme Dragon Blood Audit Once

on:
  push:
    branches:
      - phase13
    paths:
      - .github/workflows/extreme-dragon-blood-audit-once.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current phase13.2
        uses: actions/checkout@v4
        with:
          ref: phase13.2
          fetch-depth: 1

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pydantic==2.13.4

      - name: Run Dragon Blood focused tests
        run: |
          python -m pytest \
            services/tests/test_extreme_dragon_blood_canonical_event_integration.py \
            services/tests/test_extreme_dragon_blood_wound_blocker.py \
            services/tests/test_extreme_elder_dragon_blood_wound_curve_service.py
