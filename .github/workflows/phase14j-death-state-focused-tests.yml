name: Phase 14J death-state focused tests

on:
  push:
    branches: [phase14]
    paths:
      - "services/combat_simulation_health_service.py"
      - "services/combat_simulation_snapshot_service.py"
      - "services/combat_simulation_target_binding_service.py"
      - "services/combat_simulation_service.py"
      - "services/combat_simulation_healing_service.py"
      - "services/combat_simulation_outgoing_damage_service.py"
      - "services/tests/test_combat_simulation_health_service.py"
      - "services/tests/test_combat_simulation_snapshot_service.py"
      - "services/tests/test_combat_simulation_target_binding_service.py"
      - "services/tests/test_combat_simulation_service.py"
      - "services/tests/test_combat_simulation_healing_service.py"
      - "services/tests/test_combat_simulation_outgoing_damage_service.py"
      - ".github/workflows/phase14j-death-state-focused-tests.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Phase 14J death-state validation
        run: |
          pytest \
            services/tests/test_combat_simulation_health_service.py \
            services/tests/test_combat_simulation_snapshot_service.py \
            services/tests/test_combat_simulation_target_binding_service.py \
            services/tests/test_combat_simulation_service.py \
            services/tests/test_combat_simulation_healing_service.py \
            services/tests/test_combat_simulation_outgoing_damage_service.py -q
