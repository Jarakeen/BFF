name: Extreme Skill Buff Discovery Once

on:
  push:
    branches:
      - phase13
    paths:
      - .github/workflows/extreme-skill-buff-discovery-once.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current phase13.2
        uses: actions/checkout@v4
        with:
          ref: phase13.2
          fetch-depth: 0

      - name: Patch skill buff discovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service_path = Path('services/extreme_actual_heal_skill_buff_candidate_service.py')
          service_path.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom minmax.build_candidate import BuildCandidate\nfrom minmax.character_build.effect_layer import EffectLayer\nfrom minmax.named_combat_buffs import canonical_buff_name, effects_for_buff\nfrom minmax.skill_coefficient_repository import ability_entity_id\nfrom minmax.skill_effect_repository import SkillEffectRepository\nfrom minmax.support_target_type import SupportTargetType\nfrom models.build_model import PlayerBuild\nfrom services.extreme_complete_optimization_service import ExtremeCompleteOptimizationService\n\n\nclass ExtremeActualHealSkillBuffCandidateService:\n    """Discover legal self-buff skill carriers for an explicit pre-cast snapshot.\n\n    Only unconditional SELF-target CAST effects with a positive sourced duration\n    and a named stat-buff mapping are admitted. Triggered/conditional variants\n    stay out of this first discovery slice rather than being optimistically\n    treated as available.\n    """\n\n    def __init__(\n        self,\n        database_path: str | Path,\n        *,\n        repository: SkillEffectRepository | None = None,\n    ) -> None:\n        self.database_path = Path(database_path)\n        self.repository = repository or SkillEffectRepository(self.database_path)\n\n    @staticmethod\n    def _buff_name(effect) -> str | None:\n        if effect.layer is not EffectLayer.CAST:\n            return None\n        if effect.target_type is not SupportTargetType.SELF:\n            return None\n        if effect.condition is not None or effect.trigger is not None:\n            return None\n        if effect.duration is None or float(effect.duration) <= 0.0:\n            return None\n        canonical = canonical_buff_name(str(effect.name or "").replace("_", " "))\n        if canonical is None or not effects_for_buff(canonical):\n            return None\n        return canonical\n\n    def _available(self, build: PlayerBuild):\n        result = []\n        for ability_id, name in self.repository.available_skills(build.EsoClass):\n            buffs = tuple(\n                dict.fromkeys(\n                    buff\n                    for effect in self.repository.resolve(ability_id)\n                    if (buff := self._buff_name(effect))\n                )\n            )\n            if buffs:\n                result.append((int(ability_id), str(name).strip(), buffs))\n        return tuple(result)\n\n    def active_named_buffs(\n        self,\n        build: PlayerBuild,\n        *,\n        active_bar: str,\n        elapsed_seconds: float,\n    ) -> tuple[str, ...]:\n        elapsed = float(elapsed_seconds)\n        if elapsed < 0.0:\n            raise ValueError("skill pre-cast elapsed time cannot be negative")\n        available = {name.casefold(): ability_id for ability_id, name, _ in self._available(build)}\n        attr = "BackBarSkills" if str(active_bar or "front").casefold() == "back" else "FrontBarSkills"\n        seen: set[str] = set()\n        buffs: list[str] = []\n        for raw_name in list(getattr(build, attr))[:5]:\n            name = str(raw_name or "").strip()\n            ability_id = available.get(name.casefold())\n            if ability_id is None:\n                continue\n            for effect in self.repository.resolve(ability_id):\n                buff = self._buff_name(effect)\n                if buff is None or elapsed >= float(effect.duration):\n                    continue\n                key = buff.casefold()\n                if key in seen:\n                    continue\n                seen.add(key)\n                buffs.append(buff)\n        return tuple(buffs)\n\n    def build_candidates(\n        self,\n        baseline_build: PlayerBuild,\n        *,\n        character_id: str,\n        baseline_build_id: str,\n        protected_entity_id: str,\n        active_bar: str,\n    ) -> tuple[BuildCandidate, ...]:\n        entity = str(protected_entity_id or "").strip()\n        if not entity:\n            return ()\n        attr = "BackBarSkills" if str(active_bar or "front").casefold() == "back" else "FrontBarSkills"\n        original = list(getattr(baseline_build, attr))\n        while len(original) < 6:\n            original.append("")\n        original = original[:6]\n        protected = {\n            index\n            for index, raw_name in enumerate(original[:5])\n            if ability_entity_id(str(raw_name or "").strip()) == entity\n        }\n        if not protected:\n            return ()\n\n        result: list[BuildCandidate] = []\n        for ability_id, candidate_name, buffs in self._available(baseline_build):\n            for slot_index in range(5):\n                if slot_index in protected:\n                    continue\n                before = str(original[slot_index] or "").strip()\n                if before.casefold() == candidate_name.casefold():\n                    continue\n                if any(\n                    index != slot_index\n                    and str(name or "").strip().casefold() == candidate_name.casefold()\n                    for index, name in enumerate(original[:5])\n                ):\n                    continue\n                build = PlayerBuild.from_dict(baseline_build.to_dict())\n                skills = list(getattr(build, attr))\n                while len(skills) < 6:\n                    skills.append("")\n                skills = skills[:6]\n                skills[slot_index] = candidate_name\n                setattr(build, attr, skills)\n                result.append(\n                    ExtremeCompleteOptimizationService._direct_candidate(\n                        build,\n                        character_id=character_id,\n                        baseline_build_id=baseline_build_id,\n                        token=(\n                            f"actual-heal-skill-buff:{active_bar}:"\n                            f"{slot_index}:{ability_id}"\n                        ),\n                        path=f"{attr}[{slot_index}]",\n                        before=before,\n                        after={\n                            "skill": candidate_name,\n                            "ability_id": ability_id,\n                            "named_buffs": buffs,\n                        },\n                        source="extreme:actual-heal:skill-buff",\n                    )\n                )\n        return tuple(result)\n''', encoding='utf-8')

          path = Path('services/extreme_conditional_actual_heal_optimization_service.py')
          text = path.read_text(encoding='utf-8')
          old = '''from services.extreme_actual_heal_potion_candidate_service import (\n    ExtremeActualHealPotionCandidateService,\n)'''
          new = old + '''\nfrom services.extreme_actual_heal_skill_buff_candidate_service import (\n    ExtremeActualHealSkillBuffCandidateService,\n)'''
          if 'ExtremeActualHealSkillBuffCandidateService' not in text:
              if old not in text:
                  raise SystemExit('skill buff import insertion point not found')
              text = text.replace(old, new, 1)

          old = '''        potion_use_resolver: PotionUseEventResolver | None = None,\n        potion_candidates: ExtremeActualHealPotionCandidateService | None = None,\n        restoration_heavy_state: ExtremeRestorationHeavyCombatStateService | None = None,'''
          new = '''        potion_use_resolver: PotionUseEventResolver | None = None,\n        potion_candidates: ExtremeActualHealPotionCandidateService | None = None,\n        skill_precast_elapsed_seconds: float | None = None,\n        skill_buff_candidates: ExtremeActualHealSkillBuffCandidateService | None = None,\n        restoration_heavy_state: ExtremeRestorationHeavyCombatStateService | None = None,'''
          if old not in text:
              raise SystemExit('skill buff constructor insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        self.potion_use_resolver = potion_use_resolver\n        self.potion_candidates = potion_candidates\n        self.restoration_heavy_state = restoration_heavy_state'''
          new = '''        self.potion_use_resolver = potion_use_resolver\n        self.potion_candidates = potion_candidates\n        if skill_precast_elapsed_seconds is None:\n            self.skill_precast_elapsed_seconds = None\n        else:\n            skill_elapsed = float(skill_precast_elapsed_seconds)\n            if skill_elapsed < 0.0:\n                raise ValueError("skill_precast_elapsed_seconds cannot be negative")\n            self.skill_precast_elapsed_seconds = skill_elapsed\n        self.skill_buff_candidates = skill_buff_candidates\n        self.restoration_heavy_state = restoration_heavy_state'''
          if old not in text:
              raise SystemExit('skill buff assignment insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        if self.potion_elapsed_seconds is not None:\n            scenarios.append(\n                "explicit saved-potion use window at "\n                f"{self.potion_elapsed_seconds:.6f} seconds; "\n                "Medicinal Use duration requires progression proof"\n            )\n        if self.sacred_ground_window_active:'''
          new = '''        if self.potion_elapsed_seconds is not None:\n            scenarios.append(\n                "explicit saved-potion use window at "\n                f"{self.potion_elapsed_seconds:.6f} seconds; "\n                "Medicinal Use duration requires progression proof"\n            )\n        if self.skill_precast_elapsed_seconds is not None:\n            scenarios.append(\n                "explicit self-buff skill pre-cast window at "\n                f"{self.skill_precast_elapsed_seconds:.6f} seconds; "\n                "only unconditional self-target named buffs are discoverable"\n            )\n        if self.sacred_ground_window_active:'''
          if old not in text:
              raise SystemExit('skill buff search-scope insertion point not found')
          text = text.replace(old, new, 1)

          start = text.index('    def _additional_candidates(')
          end = text.index('    def _restoration_combat_state(', start)
          replacement = '''    def _additional_candidates(\n        self,\n        baseline_build: PlayerBuild,\n        *,\n        progression: CharacterProgression,\n        character_id: str,\n        baseline_build_id: str,\n        entity_id: str,\n        active_bar: str,\n    ):\n        _ = progression\n        result = []\n        if self.potion_elapsed_seconds is not None:\n            service = self.potion_candidates\n            if service is None:\n                service = ExtremeActualHealPotionCandidateService()\n                self.potion_candidates = service\n            result.extend(\n                service.build_candidates(\n                    baseline_build,\n                    character_id=character_id,\n                    baseline_build_id=baseline_build_id,\n                )\n            )\n        if self.skill_precast_elapsed_seconds is not None:\n            service = self.skill_buff_candidates\n            if service is None:\n                database_path = getattr(self.optimizer, "database_path", None)\n                if database_path is not None:\n                    service = ExtremeActualHealSkillBuffCandidateService(database_path)\n                    self.skill_buff_candidates = service\n            if service is not None:\n                result.extend(\n                    service.build_candidates(\n                        baseline_build,\n                        character_id=character_id,\n                        baseline_build_id=baseline_build_id,\n                        protected_entity_id=entity_id,\n                        active_bar=active_bar,\n                    )\n                )\n        return tuple(result)\n\n'''
          text = text[:start] + replacement + text[end:]

          old = '''        in_combat = False\n\n        if self.potion_elapsed_seconds is not None:'''
          new = '''        in_combat = False\n\n        if self.skill_precast_elapsed_seconds is not None:\n            service = self.skill_buff_candidates\n            if service is None:\n                database_path = getattr(self.optimizer, "database_path", None)\n                if database_path is not None:\n                    service = ExtremeActualHealSkillBuffCandidateService(database_path)\n                    self.skill_buff_candidates = service\n            if service is not None:\n                active_buffs.extend(\n                    service.active_named_buffs(\n                        build,\n                        active_bar=active_bar,\n                        elapsed_seconds=self.skill_precast_elapsed_seconds,\n                    )\n                )\n\n        if self.potion_elapsed_seconds is not None:'''
          if old not in text:
              raise SystemExit('skill buff combat-state insertion point not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('services/tests/test_extreme_actual_heal_skill_buff_candidate_service.py')
          test_path.write_text('''from minmax.character_build.effect_instance import EffectVariant\nfrom minmax.character_build.effect_layer import EffectLayer\nfrom minmax.support_target_type import SupportTargetType\nfrom models.build_model import PlayerBuild\nfrom services.extreme_actual_heal_skill_buff_candidate_service import (\n    ExtremeActualHealSkillBuffCandidateService,\n)\n\n\nclass _Repository:\n    @staticmethod\n    def available_skills(character_class=None):\n        _ = character_class\n        return (\n            (1, "Power Surge"),\n            (2, "Conditional Power"),\n            (3, "Ally Power"),\n        )\n\n    @staticmethod\n    def resolve(ability_id):\n        if ability_id == 1:\n            return (\n                EffectVariant(\n                    name="major_sorcery",\n                    layer=EffectLayer.CAST,\n                    source="Power Surge",\n                    duration=20.0,\n                    target_type=SupportTargetType.SELF,\n                ),\n            )\n        if ability_id == 2:\n            return (\n                EffectVariant(\n                    name="major_sorcery",\n                    layer=EffectLayer.CAST,\n                    source="Conditional Power",\n                    duration=20.0,\n                    condition="while special condition is true",\n                    target_type=SupportTargetType.SELF,\n                ),\n            )\n        return (\n            EffectVariant(\n                name="major_sorcery",\n                layer=EffectLayer.CAST,\n                source="Ally Power",\n                duration=20.0,\n                target_type=SupportTargetType.ALLY,\n            ),\n        )\n\n\ndef _build():\n    return PlayerBuild(\n        BuildName="Skill Buff Search",\n        EsoClass="Sorcerer",\n        FrontBarSkills=[\n            "Blessing of Protection",\n            "Filler One",\n            "Filler Two",\n            "",\n            "",\n            "",\n        ],\n    )\n\n\ndef test_skill_buff_candidates_only_use_unconditional_self_named_buffs():\n    service = ExtremeActualHealSkillBuffCandidateService(\n        "unused.db", repository=_Repository()\n    )\n    candidates = service.build_candidates(\n        _build(),\n        character_id="char-1",\n        baseline_build_id="build-1",\n        protected_entity_id="blessing_of_protection",\n        active_bar="front",\n    )\n\n    assert candidates\n    assert {candidate.changes[0].after["skill"] for candidate in candidates} == {"Power Surge"}\n    assert all(candidate.changes[0].path != "FrontBarSkills[0]" for candidate in candidates)\n\n\ndef test_skill_buff_active_window_respects_exact_duration_boundary():\n    service = ExtremeActualHealSkillBuffCandidateService(\n        "unused.db", repository=_Repository()\n    )\n    build = _build()\n    build.FrontBarSkills[1] = "Power Surge"\n\n    assert service.active_named_buffs(\n        build, active_bar="front", elapsed_seconds=19.999\n    ) == ("Major Sorcery",)\n    assert service.active_named_buffs(\n        build, active_bar="front", elapsed_seconds=20.0\n    ) == ()\n\n\ndef test_skill_buff_candidates_fail_closed_when_scored_heal_is_not_on_bar():\n    service = ExtremeActualHealSkillBuffCandidateService(\n        "unused.db", repository=_Repository()\n    )\n    assert service.build_candidates(\n        _build(),\n        character_id="char-1",\n        baseline_build_id="build-1",\n        protected_entity_id="different_heal",\n        active_bar="front",\n    ) == ()\n''', encoding='utf-8')

          conditional_test_path = Path('services/tests/test_extreme_conditional_actual_heal_optimization_service.py')
          tests = conditional_test_path.read_text(encoding='utf-8')
          marker = 'class _SkillBuffCandidates:'
          if marker not in tests:
              insert_at = tests.index('\ndef _install_progression_adapter')
              helper = '''\n\nclass _SkillBuffCandidates:\n    def __init__(self):\n        self.candidate_calls = []\n        self.active_calls = []\n\n    def build_candidates(\n        self, baseline_build, *, character_id, baseline_build_id, protected_entity_id, active_bar\n    ):\n        self.candidate_calls.append((protected_entity_id, active_bar))\n        return ()\n\n    def active_named_buffs(self, build, *, active_bar, elapsed_seconds):\n        self.active_calls.append((build.BuildName, active_bar, elapsed_seconds))\n        return ("Major Sorcery",) if elapsed_seconds < 20.0 else ()\n'''
              tests = tests[:insert_at] + helper + tests[insert_at:]

          marker = 'def test_conditional_optimizer_discovers_skill_buff_sources_only_for_explicit_precast_window'
          if marker not in tests:
              tests += '''\n\ndef test_conditional_optimizer_discovers_skill_buff_sources_only_for_explicit_precast_window():\n    skill_service = _SkillBuffCandidates()\n    active = ExtremeConditionalActualHealOptimizationService(\n        target_health_fraction=0.29,\n        skill_precast_elapsed_seconds=5.0,\n        skill_buff_candidates=skill_service,\n        optimizer=_Optimizer(),\n        healing_events=_ConditionalHealingEvents(),\n    )\n    assert active._additional_candidates(\n        PlayerBuild(BuildName="Skill Discovery", FrontBarSkills=["Blessing of Protection"]),\n        progression=CharacterProgression(passive_ranks={}),\n        character_id="char-1",\n        baseline_build_id="build-1",\n        entity_id="blessing_of_protection",\n        active_bar="front",\n    ) == ()\n    assert skill_service.candidate_calls == [("blessing_of_protection", "front")]\n\n    state, unresolved = active._restoration_combat_state(\n        build=PlayerBuild(BuildName="Skill Discovery"),\n        progression=CharacterProgression(passive_ranks={}),\n        active_bar="front",\n    )\n    assert unresolved == ()\n    assert state.has_buff("Major Sorcery")\n\n\ndef test_conditional_optimizer_rejects_negative_skill_precast_time():\n    import pytest\n    with pytest.raises(ValueError, match="skill_precast_elapsed_seconds cannot be negative"):\n        ExtremeConditionalActualHealOptimizationService(\n            target_health_fraction=0.29,\n            skill_precast_elapsed_seconds=-0.01,\n            optimizer=_Optimizer(),\n            healing_events=_ConditionalHealingEvents(),\n        )\n'''
              conditional_test_path.write_text(tests, encoding='utf-8')

          notes_path = Path('GAME_MECHANICS_FIELD_NOTES.md')
          notes = notes_path.read_text(encoding='utf-8')
          heading = '## 2026-09-09 — Skill-buff discovery requires an explicit pre-cast snapshot'
          if heading not in notes:
              notes += f'''\n\n---\n\n{heading}\n\nExtreme MOST Actual Heal may discover a slottable skill as a named self-buff source only inside an explicit pre-cast timing scenario. The first reviewed slice admits only canonical CAST effects that target SELF, have a positive sourced duration, map to a supported named stat buff, and carry no extra condition or trigger.\n\n**Layman’s version:** if the optimizer wants Major Sorcery from a skill, it must actually slot a legal skill that grants it and the buff must still be alive when the heal lands. Conditional or proc-based skill effects are not waved through just because their name looks useful.\n\n**For BFF:** the scored heal's slot is protected during source discovery. Standing optimization is unchanged, and runtime/conditional skill effects remain outside this first automatic-discovery slice.\n'''
              notes_path.write_text(notes, encoding='utf-8')
          PY

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pydantic==2.13.4

      - name: Run focused Extreme skill discovery tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            services/tests/test_extreme_actual_heal_skill_buff_candidate_service.py \
            services/tests/test_extreme_actual_heal_potion_candidate_service.py \
            services/tests/test_extreme_conditional_actual_heal_optimization_service.py \
            services/tests/test_extreme_actual_heal_optimization_service.py \
            minmax/tests/test_named_combat_buffs.py \
            services/tests/test_extreme_optimization_read_only_database.py

      - name: Commit and push if phase13.2 is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin phase13.2
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/phase13.2)" || { echo 'phase13.2 moved during skill buff discovery; refusing stale push'; exit 1; }
          git config user.name "Jarakeen"
          git config user.email "jarakeene@gmail.com"
          git add \
            services/extreme_actual_heal_skill_buff_candidate_service.py \
            services/extreme_conditional_actual_heal_optimization_service.py \
            services/tests/test_extreme_actual_heal_skill_buff_candidate_service.py \
            services/tests/test_extreme_conditional_actual_heal_optimization_service.py \
            GAME_MECHANICS_FIELD_NOTES.md
          git diff --cached --stat
          git commit -m "feat: discover skill buff sources for Extreme heals"
          git push origin HEAD:phase13.2
